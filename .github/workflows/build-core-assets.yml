name: Build Core Assets

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Monorepo tag to build (e.g. cp-26.04.2-1). Leave empty to auto-detect latest 26.04.'
        required: false
        default: ''
        type: string
  schedule:
    # Daily at 02:00 UTC
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-24.04
    outputs:
      source_tag: ${{ steps.resolve.outputs.source_tag }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Resolve source tag
        id: resolve
        run: |
          SOURCE_TAG="${{ inputs.source_tag }}"
          if [ -z "$SOURCE_TAG" ]; then
            echo "No tag specified, finding latest cp-26.04* tag..."
            SOURCE_TAG=$(git ls-remote --tags --sort=-v:refname \
              https://gerrit.collaboraoffice.com/online 'refs/tags/cp-26.04*' \
              | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')
          fi
          if [ -z "$SOURCE_TAG" ]; then
            echo "::error::Could not resolve a source tag"
            exit 1
          fi
          echo "Resolved source tag: $SOURCE_TAG"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve.outputs.source_tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing release for $TAG, will build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SOURCE_TAG: ${{ needs.resolve-tag.outputs.source_tag }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git autoconf automake libtool pkg-config \
            ccache cmake nasm gperf bison flex \
            python3 python3-dev python3-lxml python3-polib \
            libcups2-dev libfontconfig1-dev \
            libcap-dev libcppunit-dev libpam0g-dev libpng-dev \
            libnss3-dev libssl-dev libzstd-dev \
            libxslt1-dev xsltproc libxml2-utils \
            libxrandr-dev libx11-dev libxext-dev libxrender-dev \
            zip wget curl libkrb5-dev gettext

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-engine-${{ env.SOURCE_TAG }}-${{ github.run_id }}
          restore-keys: |
            ccache-engine-${{ env.SOURCE_TAG }}-
            ccache-engine-cp-26.04-
            ccache-engine-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache -z

      - name: Clone monorepo
        run: |
          echo "Cloning monorepo at tag $SOURCE_TAG ..."
          git clone --depth=1 --branch "$SOURCE_TAG" \
            https://gerrit.collaboraoffice.com/online online
          echo "SOURCE_COMMIT=$(git -C online rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure engine
        working-directory: online/engine
        run: |
          ./autogen.sh \
            --with-distro=CPLinux-LOKit \
            --without-package-format \
            --with-system-nss \
            --disable-symbols \
            --disable-sal-log

      - name: Build engine
        working-directory: online/engine
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          make -j"$(nproc)"

      - name: Strip binaries
        working-directory: online/engine
        run: |
          find instdir/program -name '*.so' -exec strip --strip-debug {} + 2>/dev/null || true
          find instdir/program -name '*.bin' -exec strip --strip-debug {} + 2>/dev/null || true
          find instdir/program -type f -executable ! -name '*.so' \
            -exec sh -c 'file "$1" | grep -q ELF && strip --strip-debug "$1"' _ {} \; 2>/dev/null || true

      - name: Clean instdir
        working-directory: online/engine
        run: |
          find instdir -name '*.pyc' -delete
          find instdir -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          find instdir -name '*-gdb.py' -delete
          echo "instdir size:"
          du -sh instdir/
          echo "include size:"
          du -sh include/

      - name: Package tarball
        run: |
          TARBALL="core-co-26.04-assets.tar.gz"
          tar czf "$TARBALL" -C online/engine instdir include
          ls -lh "$TARBALL"
          sha256sum "$TARBALL" | tee "${TARBALL}.sha256"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "TARBALL_SHA256=$(cut -d' ' -f1 < "${TARBALL}.sha256")" >> "$GITHUB_ENV"

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SOURCE_TAG }}
          name: "Core assets ${{ env.SOURCE_TAG }}"
          body: |
            ## Collabora Office Core Assets

            **Source tag**: `${{ env.SOURCE_TAG }}`
            **Source commit**: `${{ env.SOURCE_COMMIT }}`

            ### Contents
            - `instdir/` - Collabora Office engine runtime
            - `include/` - Core headers (LibreOfficeKit/)

            ### SHA256
            ```
            ${{ env.TARBALL_SHA256 }}  core-co-26.04-assets.tar.gz
            ```
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
